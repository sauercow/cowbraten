// Essential bindings normally declared by data/menus.cfg.
// This file intentionally contains no GUI definitions.
togglemainmenu = [|| (cleartexgui) [cleargui 1] [showgui "main"]]
bind ESCAPE [togglemainmenu]

// Preserve the public helper used by personal configs without depending on
// rollover state owned by the original menu implementation.
chooseplayermodel = [showgui "playermodel"]
